# ThingsBoard CE + PostgreSQL chạy local cho Lab 4 (NT532.R12 - Nhóm 10)
# Theo hướng dẫn chính thức: https://thingsboard.io/docs/user-guide/install/docker-windows/
#
# Cài lần đầu (tạo bảng trong PostgreSQL, KHÔNG nạp dữ liệu demo):
#   docker compose run --rm -e INSTALL_TB=true thingsboard-ce
# Chạy:     docker compose up -d
# Dừng:     docker compose stop        (giữ dữ liệu)
# Xem log:  docker compose logs -f thingsboard-ce
#
# Cổng mở ra máy thật:
#   8080 - giao diện web + REST API + WebSocket
#   1883 - MQTT (ESP32, Raspberry Pi kết nối vào đây)

name: nt532-lab4

services:
  postgres:
    image: "postgres:18"
    restart: always
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 5s
      timeout: 5s
      retries: 20

  thingsboard-ce:
    image: "thingsboard/tb-node:4.3.1.8"
    restart: always
    ports:
      - "8080:8080"
      - "1883:1883"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      TB_SERVICE_ID: tb-ce-node
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_PASSWORD: postgres
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: nt532-lab4-tb-postgres
    driver: local
