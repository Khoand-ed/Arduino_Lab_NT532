# Cấu hình Mosquitto cho Lab 3 (chép vào /etc/mosquitto/conf.d/lab3.conf trên Raspberry Pi)
#
# Mosquitto 2.x mặc định CHỈ nhận kết nối từ chính Raspberry Pi (localhost).
# Hai dòng dưới mở cổng 1883 cho mọi máy trong mạng (ESP32, laptop) và cho phép
# kết nối không cần tài khoản - chỉ dùng trong mạng lab.

listener 1883 0.0.0.0
allow_anonymous true
